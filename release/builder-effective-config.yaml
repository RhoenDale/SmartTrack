directories:
  output: release
  buildResources: build
appId: com.smarttrack.desktop
productName: SmartTrack
copyright: Copyright © 2024 SmartTrack
asar: true
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - package.json
      - '!node_modules/**/*'
      - '!src/**/*'
      - '!*.md'
      - '!*.log'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SmartTrack
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: SmartTrack-Setup-${version}.exe
  deleteAppDataOnUninstall: false
  license: null
electronVersion: 43.1.1
